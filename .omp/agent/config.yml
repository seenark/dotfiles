setupVersion: 2
modelRoles:
  plan: openai-codex/gpt-6.1-sol:xhigh
  commit: openai-codex/gpt-6-luna:off
  designer: openai-codex/gpt-6-sol:auto
  slow: openai-codex/gpt-6.1-sol:xhigh
  vision: openai-codex/gpt-6-luna:auto
  default: openai-codex/gpt-6.1-sol:xhigh
  task: openai-codex/gpt-6.1-sol:high
  advisor: openai-codex/gpt-6.1-sol:max
  smol: openai-codex/gpt-6-luna:medium
  tiny: openai-codex/gpt-6-luna:medium
startup:
  quiet: true
searxng:
  endpoint: https://searxng.codesook.dev
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight.codesook.dev
  apiToken: this_is_api_key
  bankId: null
  scoping: per-project
theme:
  dark: catppuccin-mocha
  light: light-catppuccin
statusLine:
  separator: powerline
  preset: custom
  sessionAccent: true
  transparent: true
  leftSegments:
    - mode
    - git
    - model
    - context_pct
    - token_total
    - cost
    - token_rate
  rightSegments:
    - subagents
    - time
  contextLine: percentage
  compactThinkingLevel: false
  showHookStatus: true
tui:
  textSizing: false
  hyperlinks: auto
  tight: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
showHardwareCursor: true
task:
  showResolvedModelBadge: true
  eager: preferred
  maxRecursionDepth: -1
tools:
  approvalMode: yolo
autolearn:
  enabled: true
  autoContinue: false
edit:
  mode: hashline
plan:
  defaultOnStartup: true
dev:
  autoqaConsent: denied
defaultThinkingLevel: auto
cycleOrder:
  - smol
  - default
  - task
  - commit
codexResets:
  autoRedeem: "no"