setupVersion: 2
modelRoles:
  plan: anthropic/claude-opus-5-5:high
  commit: openai-codex/gpt-6-luna:low
  designer: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  vision: openai-codex/gpt-6-luna:auto
  default: anthropic/claude-sonnet-5-5:medium
  task: anthropic/claude-sonnet-5-5:high
  advisor: openai-codex/gpt-6.1-sol:xhigh
  smol: anthropic/claude-sonnet-5-5:high
  tiny: openai-codex/gpt-6-luna:medium
  pstack-panel-a: anthropic/claude-opus-5-5:medium
  pstack-panel-b: openai-codex/gpt-6.1-sol:medium
startup:
  quiet: true
searxng:
  endpoint: https://searxng.codesook.dev
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight.codesook.dev
  apiToken: this_is_api_key
  bankId: null
  scoping: per-project
theme:
  dark: catppuccin-mocha
  light: light-catppuccin
statusLine:
  separator: powerline
  preset: custom
  sessionAccent: true
  transparent: true
  leftSegments:
    - mode
    - git
    - model
    - context_pct
    - token_total
    - cost
    - token_rate
  rightSegments:
    - subagents
    - time
  contextLine: percentage
  compactThinkingLevel: false
  showHookStatus: true
tui:
  textSizing: false
  hyperlinks: auto
  tight: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
showHardwareCursor: true
task:
  showResolvedModelBadge: true
  eager: preferred
  maxRecursionDepth: -1
  isolation:
    enabled: true
tools:
  approvalMode: yolo
autolearn:
  enabled: true
  autoContinue: false
edit:
  mode: hashline
plan:
  defaultOnStartup: false
  enabled: true
dev:
  autoqaConsent: denied
defaultThinkingLevel: auto
cycleOrder:
  - smol
  - default
  - task
  - commit
codexResets:
  autoRedeem: "no"
retry:
  fallbackChains:
    pstack-panel-a: []
    pstack-panel-b: []