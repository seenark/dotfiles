setupVersion: 1
modelRoles: 
  plan: openai-codex/gpt-5.6-luna:max
  smol: openai-codex/gpt-5.6-luna:off
  task: openai-codex/gpt-5.6-luna:max
  commit: openai-codex/gpt-5.4:off
  tiny: openai-codex/gpt-5.4
  designer: openai-codex/gpt-5.6-luna
  slow: openai-codex/gpt-5.6-sol
  advisor: openai-codex/gpt-5.6-luna:max
  vision: openai-codex/gpt-5.6-luna
  default: openai-codex/gpt-5.6-luna:max
startup: 
  quiet: true
searxng: 
  endpoint: https://searxng.codesook.dev
memory: 
  backend: hindsight
hindsight: 
  apiUrl: https://hindsight.codesook.dev
  apiToken: this_is_api_key
  bankId: null
  scoping: per-project
theme: 
  dark: catppuccin-mocha
  light: light-catppuccin
statusLine: 
  separator: powerline
  preset: custom
  sessionAccent: true
  transparent: true
  leftSegments: 
    - mode
    - git
    - context_pct
    - cost
    - time
  rightSegments: 
    - subagents
    - model
tui: 
  textSizing: false
  hyperlinks: auto
  tight: false
display: 
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
showHardwareCursor: true
task: 
  showResolvedModelBadge: true
  eager: preferred
tools: 
  approvalMode: yolo
autolearn: 
  enabled: true
  autoContinue: false
edit: 
  mode: hashline
plan: 
  defaultOnStartup: true
dev: 
  autoqaConsent: denied
defaultThinkingLevel: auto
cycleOrder: 
  - smol
  - default
  - task
  - commit